name: Sync WOS gift codes

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scrape-codes.mjs
        env:
          SCRAPER_PASS: ${{ secrets.SCRAPER_PASS }}
